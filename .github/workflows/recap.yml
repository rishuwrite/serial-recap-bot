name: serial-recaps
on:
  # External cron triggers (Google Apps Script at 12:00 AM IST & hourly 9 AM - 4 PM IST slot triggers)
  repository_dispatch:
    types: [nightly-12am, watchdog-check, ig-slot-publish]
  workflow_dispatch:
    inputs:
      only_show:
        description: "Which show (all = every show, watchdog = check logs & rerun failed/missed)"
        type: choice
        default: all
        options: [all, watchdog, kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq]
      video_id:
        description: "Optional: a specific Dangal TV episode video ID (e.g. JNdlYnNneKE) instead of the newest one"
        type: string
        default: ""
      test_mode:
        description: "Quick test: only 3 scenes (~5 min). Keep OFF (false) for full 2-3 min production video"
        type: boolean
        default: false
      upload:
        description: "Upload & schedule to YouTube, Facebook, Google Drive & Instagram (ON = enabled)"
        type: boolean
        default: true
      publish_now:
        description: "Publish immediately? (Keep OFF/false at 12 AM so videos schedule for 9 AM - 4 PM IST slots)"
        type: boolean
        default: false
      only_ig_publish:
        description: "Slot trigger: only publish pre-rendered Reel from Google Drive to Instagram right now"
        type: boolean
        default: false
      render_vertical:
        description: "Render 9:16 vertical Reel MP4 (auto-enabled when Instagram or Google Drive is enabled)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  recap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: github.event.action != 'watchdog-check' && inputs.only_show != 'watchdog'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        show: [kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - id: chk
        run: |
          S="${{ inputs.only_show || github.event.client_payload.only_show }}"
          if [ -z "$S" ] || [ "$S" = "all" ] || [ "$S" = "${{ matrix.show }}" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.chk.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install -r requirements.txt

      - name: Make recap / publish (with log check & auto-retry on failure)
        if: steps.chk.outputs.run == 'true'
        env:
          SHOW_KEY: ${{ matrix.show }}
          EVENT_NAME: ${{ github.event_name }}
          VIDEO_ID: ${{ inputs.video_id || github.event.client_payload.video_id || '' }}
          PUBLISH_NOW: ${{ inputs.publish_now || github.event.client_payload.publish_now || 'false' }}
          ONLY_IG_PUBLISH: ${{ (github.event.action == 'ig-slot-publish' && 'true') || inputs.only_ig_publish || github.event.client_payload.only_ig_publish || 'false' }}
          RENDER_VERTICAL: ${{ inputs.render_vertical || 'true' }}
          DO_UPLOAD: ${{ github.event_name == 'repository_dispatch' && 'true' || inputs.upload }}
          TEST_MODE: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.test_mode }}
          # Core AI & Image Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_FLUX_SPACE: ${{ vars.HF_FLUX_SPACE || 'https://black-forest-labs-flux-1-schnell.hf.space' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          # YouTube Secrets
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Google Drive Secrets (falls back to YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN if same Google account)
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || vars.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          # Facebook & Instagram (Meta Graph API) Secrets
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_VIDEO_URL_TEMPLATE: ${{ secrets.INSTAGRAM_VIDEO_URL_TEMPLATE }}
          # Repository Variables
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY }}
          SERIAL_CHANNEL_NAME: ${{ vars.SERIAL_CHANNEL_NAME }}
          SERIAL_VOICE: ${{ vars.SERIAL_VOICE }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME }}
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED }}
          FACEBOOK_REELS_MODE: ${{ vars.FACEBOOK_REELS_MODE }}
          FACEBOOK_CAPTION: ${{ vars.FACEBOOK_CAPTION }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED }}
          INSTAGRAM_CAPTION: ${{ vars.INSTAGRAM_CAPTION }}
          IG_MAX_REEL_SECONDS: ${{ vars.IG_MAX_REEL_SECONDS }}
          IG_PUBLISH_WITH_NIGHTLY: ${{ vars.IG_PUBLISH_WITH_NIGHTLY }}
          GDRIVE_ENABLED: ${{ vars.GDRIVE_ENABLED }}
          GDRIVE_DELETE_AFTER_PUBLISH: ${{ vars.GDRIVE_DELETE_AFTER_PUBLISH }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: |
          set +e
          for attempt in 1 2; do
            echo "=== [${SHOW_KEY}] Run Attempt ${attempt}/2 ==="
            git pull --rebase -q origin main 2>/dev/null || true
            python recap/main.py
            code=$?
            if [ $code -eq 0 ]; then
              echo "=== [${SHOW_KEY}] Succeeded on attempt ${attempt} ==="
              exit 0
            fi
            echo "=== [${SHOW_KEY}] Attempt ${attempt} failed (exit ${code}). Inspecting status log... ==="
            if [ -f "state/${SHOW_KEY}_status.json" ]; then
              cat "state/${SHOW_KEY}_status.json"
            fi
            if [ $attempt -lt 2 ]; then
              echo "=== [${SHOW_KEY}] Cleaning temporary files & retrying in 45s... ==="
              rm -rf "tmp_${SHOW_KEY}"
              sleep 45
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && steps.chk.outputs.run == 'true'
        with:
          name: recap-${{ matrix.show }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state & status logs
        if: always() && steps.chk.outputs.run == 'true'
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state/ 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to save"; exit 0; }
          git commit -m "state ${{ matrix.show }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase -q && git push && break
            sleep $((RANDOM % 8 + 3))
          done

  watchdog:
    name: watchdog-log-checker
    runs-on: ubuntu-24.04
    needs: [recap]
    if: always()
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install watchdog dependencies
        run: |
          pip install -r requirements.txt
          git pull --rebase -q origin main || true

      - name: Read logs, verify YouTube/Facebook/Instagram/Drive, and auto-rerun failed/missed shows
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || vars.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED }}
          GDRIVE_ENABLED: ${{ vars.GDRIVE_ENABLED }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: python recap/watchdog.py

      - name: Save watchdog state
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state/ 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to save"; exit 0; }
          git commit -m "watchdog state" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && break
            sleep $((RANDOM % 6 + 2))
          done
